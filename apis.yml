- name: Self.ID React API
  description: >-
    React hooks and utilities for Ceramic-based DID authentication and record interactions. Provides useViewerRecord,
    usePublicRecord, useViewerConnection, and related hooks so React applications can connect an Ethereum
    wallet, authenticate a DID, and reactively read or write identity profile data.
  humanURL: https://developers.ceramic.network/tools/self-id/overview/
  baseURL: https://ceramic-clay.3boxlabs.com
  tags:
