- name: Self.ID Framework API
  description: >-
    Highest-level React framework abstraction for decentralized identity apps built on Ceramic. Wraps
    the core, web, and react packages into a single Provider + hooks surface (useViewerConnection, useViewerRecord,
    usePublicRecord) to quickly bootstrap authentication, state management, and DID data access in React
    applications.
