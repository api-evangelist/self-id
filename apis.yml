apis:
- name: Self.ID Web API
  description: >-
    Read and write DID identity records in browser environments. Exports WebClient and SelfID classes
    enabling Ethereum-based authentication via 3ID Connect, then get/set/merge operations on records (basicProfile,
    cryptoAccounts, alsoKnownAs) anchored to the authenticated DID on a Ceramic node.
  humanURL: https://developers.ceramic.network/tools/self-id/write/
  baseURL: https://ceramic-clay.3boxlabs.com
